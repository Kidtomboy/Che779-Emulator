plugins {
    id 'com.android.library'
}

android {
    compileSdk COMPILE_SDK
    namespace 'com.android.dx'

    defaultConfig {
        minSdk MIN_SDK
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
