name: Build Che779 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDevDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log (de doc loi tu xa)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 400 build.log > build-tail.log || true
          gh release delete buildlog --cleanup-tag --yes || true
          gh release create buildlog build-tail.log --prerelease \
            --title "build log" --notes "Log build gan nhat (400 dong cuoi)" --target "$GITHUB_SHA" || true

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/debug/*.apk dist/Che779-Emulator.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Che779-Emulator-APK
          path: dist/Che779-Emulator.apk
          if-no-files-found: error

      - name: Publish to Releases (tai khong can dang nhap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/Che779-Emulator.apk \
            --prerelease \
            --title "Che779 Emulator - ban moi nhat" \
            --notes "Ban build tu dong tu commit ${GITHUB_SHA::7}. Tai file Che779-Emulator.apk va cai dat." \
            --target "$GITHUB_SHA"
