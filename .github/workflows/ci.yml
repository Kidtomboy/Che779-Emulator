name: Kiểm tra (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra-tinh:
    name: Kiểm tra cấu trúc repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python tests/verify_project1.py

  emulator:
    name: Build Emulator (Java)
    needs: kiem-tra-tinh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: bash ./build.sh
        working-directory: apps/emulator/source
      - run: python tests/verify_project1.py --jar apps/emulator/source/Che779_Emulator.jar

  remoter-linux:
    name: Build Remoter Linux (Java)
    needs: kiem-tra-tinh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: bash ./build.sh
        working-directory: apps/remoter-linux

  remoter-windows:
    name: Build Remoter Windows (C#)
    needs: kiem-tra-tinh
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build apps/remoter-windows/source/Che779Remoter.csproj --configuration Release
      - name: Kiểm tra file .exe
        shell: pwsh
        run: |
          $exe = 'apps/remoter-windows/source/bin/Release/net48/Che779_Remoter.exe'
          if (!(Test-Path $exe)) { throw "Không thấy $exe" }
