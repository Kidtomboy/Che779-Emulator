name: Kiểm tra (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra-tinh:
    name: Kiểm tra cấu trúc repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python tests/verify_project1.py

  emulator:
    name: Build Emulator (Java)
    needs: kiem-tra-tinh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: bash .github/scripts/build-emulator.sh
      - run: bash tests/run-ipc-tests.sh
      - run: python tests/verify_project1.py --jar apps/emulator/source/Che779_Emulator.jar

  remoter-windows:
    name: Build Remoter Windows (C#)
    needs: kiem-tra-tinh
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build apps/remoter-windows/source/Che779Remoter.csproj --configuration Release
      - name: Kiểm tra file .exe
        shell: pwsh
        run: |
          $exe = 'apps/remoter-windows/source/bin/Release/net48/Che779_Remoter.exe'
          if (!(Test-Path $exe)) { throw "Không thấy $exe" }

  emulator-windows:
    name: Build Emulator (build_emulator.ps1, Windows)
    needs: kiem-tra-tinh
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - shell: pwsh
        run: ./apps/emulator/source/build_emulator.ps1
      - shell: pwsh
        run: if (!(Test-Path apps/emulator/source/Che779_Emulator.jar)) { throw "Không thấy jar" }

  nhat-ky-build:
    name: Nhật ký build
    if: always() && github.event_name != 'pull_request'
    needs: [kiem-tra-tinh, emulator, remoter-windows, emulator-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: buildlog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhật ký build lên Release "buildlog"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-buildlog.sh buildlog "Nhật ký build"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_id }}
          path: build-tail.log
          if-no-files-found: ignore
          retention-days: 14
