name: Phát hành

# Gắn thẻ dạng v1.3.0 (hoặc bấm chạy tay) để tự build trên Windows và đưa file tải về vào trang Releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build và đóng gói (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build Emulator (build_emulator.ps1)
        shell: pwsh
        run: ./apps/emulator/source/build_emulator.ps1
      - name: Build Remoter (dotnet)
        run: dotnet build apps/remoter-windows/source/Che779Remoter.csproj --configuration Release
      - name: Đóng gói zip + SHA256SUMS (SHA tính SAU CÙNG trên đúng file zip)
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -RemoterExe "apps/remoter-windows/source/bin/Release/net48/Che779_Remoter.exe"
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Đưa lên trang Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body: |
            ## Che779 Emulator + Remoter ${{ github.ref_name }} — Windows
            Tải file `.zip`, giải nén rồi chạy `Che779_Remoter.exe` (xem `DOC-TOI-DAY.txt`).
            Kiểm tra file tải về bằng `SHA256SUMS.txt`: `Get-FileHash <file>.zip -Algorithm SHA256`. Chi tiết: `CHANGELOG.md`.
